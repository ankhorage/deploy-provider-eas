name: Refresh Generated Files

on:
  push:
    branches:
      - feat/eas-deployment-provider

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install
      - name: Format package sources
        run: bun run format
      - name: Generate documentation
        run: bun run docs
      - name: Commit generated files
        run: |
          git config user.name "ankhorage-renovate-sync[bot]"
          git config user.email "ankhorage-renovate-sync[bot]@users.noreply.github.com"
          git add package.json bun.lock src paradox.config.ts .changeset README.md paradox
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh generated files [generated]"
          git push origin HEAD:feat/eas-deployment-provider
